hardware:
  device: "MacBook Pro"
  soc: "Apple M5"
  cpu_cores: 10
  memory_gb: 24
  backend: "Metal"
  llama_cpp_backend: "Metal"
  os: "macOS"
  # populated automatically at runtime from config/hardware.txt

base_model:
  hf_repo: "Qwen/Qwen2.5-7B-Instruct"
  local_hf_dir: "models/huggingface/Qwen2.5-7B-Instruct"
  base_gguf: "models/base/Qwen2.5-7B-Instruct-F16.gguf"

quantization:
  # F16 is base_gguf itself; these are produced from it via llama-quantize
  levels: [Q8_0, Q6_K, Q5_K_M, Q4_K_M, Q3_K_M, Q2_K]
  output_dir: "models/quantized"

inference:
  context_length: 4096
  max_output_tokens: 256
  temperature: 0
  seed: 42

benchmark:
  warmup_runs: 3
  measurement_runs: 10
  llama_bench_bin: "external/llama.cpp/build/bin/llama-bench"
  llama_quantize_bin: "external/llama.cpp/build/bin/llama-quantize"
  llama_cli_bin: "external/llama.cpp/build/bin/llama-cli"
  memory_poll_interval_sec: 0.05

paths:
  raw_csv: "data/raw/benchmark_raw.csv"
  processed_stats: "data/processed/benchmark_stats.csv"
  summary_table: "results/tables/summary.csv"
  figures_dir: "results/figures"
  summary_json: "results/summary.json"
  logs_dir: "logs"
