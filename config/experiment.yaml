hardware:
  # New runs detect hardware at runtime (src/common.py detect_hw) and write to
  # data/raw/<hw_id>/. Set `id` to override the auto-detected hw_id.
  id: null
  # Metadata of the v0.1 legacy run (data/raw/benchmark_raw.csv, read-only).
  device: "MacBook Pro"
  soc: "Apple M5"
  cpu_cores: 10
  memory_gb: 24
  backend: "Metal"
  llama_cpp_backend: "Metal"
  os: "macOS"

# v1.0 model axis. Paths: <model_dirs.hf>/<name>, <model_dirs.base>/<name>-F16.gguf,
# <quantization.output_dir>/<name>-<quant>.gguf
models:
  - {name: "Qwen2.5-1.5B-Instruct", hf_repo: "Qwen/Qwen2.5-1.5B-Instruct"}
  - {name: "Qwen2.5-3B-Instruct", hf_repo: "Qwen/Qwen2.5-3B-Instruct"}
  - {name: "Qwen2.5-7B-Instruct", hf_repo: "Qwen/Qwen2.5-7B-Instruct"}
  - {name: "Qwen2.5-14B-Instruct", hf_repo: "Qwen/Qwen2.5-14B-Instruct"}
default_model: "Qwen2.5-7B-Instruct"   # used when --model is not given
model_dirs:
  hf: "models/huggingface"
  base: "models/base"

quantization:
  # F16 is the base GGUF itself; these are produced from it via llama-quantize
  levels: [Q8_0, Q6_K, Q5_K_M, Q4_K_M, Q3_K_M, Q2_K]
  output_dir: "models/quantized"

inference:
  context_length: 4096            # v0.1 default ctx (--contexts default)
  contexts: [512, 2048, 4096, 8192]  # v0.3 context axis (--contexts all)
  max_output_tokens: 256
  # temperature/seed apply to quality_eval (llama-server) only; llama-bench
  # uses synthetic tokens and does not sample.
  temperature: 0
  seed: 42

benchmark:
  warmup_runs: 3
  measurement_runs: 10
  n_gpu_layers: 99                # >= layer count = all layers (v0.1 used llama-bench default -1 = all)
  # CUDA combos over the VRAM budget but within VRAM + host RAM: measured at the default
  # ctx only, with llama-bench -fitt (llama.cpp places what fits on the GPU, rest on CPU).
  # Fewer runs: these are slow (a few tok/s). Rows are marked n_gpu_layers "fit:<MiB>MiB".
  offload: {enabled: true, fit_target_mib: 1024, warmup_runs: 1, measurement_runs: 3}
  flash_attn: "auto"              # on|off|auto (v0.1 used the llama-bench default: auto)
  llama_bench_bin: "external/llama.cpp/build/bin/llama-bench"
  llama_quantize_bin: "external/llama.cpp/build/bin/llama-quantize"
  llama_cli_bin: "external/llama.cpp/build/bin/llama-cli"
  memory_poll_interval_sec: 0.05
  vram_poll_interval_ms: 100

# Combos whose estimated footprint exceeds the device budget are skipped and logged.
# Estimate = GGUF size + f16 KV cache(ctx, from HF config.json) + overhead_gb.
memory_budget:
  skip_over_budget: true
  overhead_gb: 0.75        # estimate: compute buffers + runtime
  metal_fraction: 0.67     # estimate of macOS default GPU working-set limit (~2/3 RAM)
  cuda_fraction: 0.95      # of total VRAM
  cpu_fraction: 0.80       # of RAM (CPU backend, or CUDA host offload in quality stage)
  # "<backend>/<model>/<quant>" fnmatch patterns, always skipped.
  # 14B Q8_0 (~15.7 GB, estimate) is close to 7B F16 (15.24 GB measured), which
  # already showed memory-pressure signs on M5 24 GB (RSS < file size, tg CV 8%).
  # 14B F16 (29.5 GB) on the 8 GB laptop with 31 GiB RAM: llama-bench tg grew swap by 3.06 GB;
  # token-by-token decoding for the quality sample would page weights from disk and not finish.
  # 14B is evaluated against Q8_0 instead (7B Q8_0 vs F16: PPL +0.09 %, 1.1 % of answers flipped).
  exclude:
    - "Metal/Qwen2.5-14B-Instruct/Q8_0"
    - "CUDA/Qwen2.5-14B-Instruct/F16"

perplexity:
  llama_perplexity_bin: "external/llama.cpp/build/bin/llama-perplexity"
  dataset_url: "https://huggingface.co/datasets/ggml-org/ci/resolve/main/wikitext-2-raw-v1.zip"
  dataset_file: "data/datasets/wikitext-2-raw/wiki.test.raw"
  ctx: 512                 # llama-perplexity default
  chunks: null             # null = full test set
  n_gpu_layers: "auto"     # auto lets llama.cpp --fit offload partially when VRAM is short

imatrix:                   # src/imatrix_fix.py: re-quantize collapsed low-bit levels with an importance matrix
  llama_imatrix_bin: "external/llama.cpp/build/bin/llama-imatrix"
  train_file: "data/datasets/wikitext-2-raw/wiki.train.raw"   # calibration text; perplexity uses the test split
  chunks: 128              # x perplexity.ctx tokens
  dir: "models/imatrix"
  check_chunks: 20         # CPU-only perplexity prefix to rule out a GPU kernel fault
  targets:
    - [Qwen2.5-3B-Instruct, Q2_K]
    - [Qwen2.5-3B-Instruct, Q3_K_M]
    - [Qwen2.5-7B-Instruct, Q2_K]
    - [Qwen2.5-7B-Instruct, Q3_K_M]

quality:
  llama_server_bin: "external/llama.cpp/build/bin/llama-server"
  sample_file: "prompts/quality.json"
  sample_seed: 42
  n_parallel: 4            # llama-server -np slots
  ctx_per_slot: 4096
  n_gpu_layers: "auto"
  fit_target_mib: 2048     # VRAM headroom for -ngl auto (default 1024 hit CUDA OOM with 14B Q6_K after 7 min)
  port: 8089
  request_timeout_sec: 3600     # per request; CPU-offloaded runs (14B on 8 GB VRAM) generate at a few tok/s per slot
  exec_timeout_sec: 10     # HumanEval per-problem test timeout
  datasets:
    mmlu: {repo: "cais/mmlu", prefix: "all/test-", per_subject: 10, max_tokens: 16}
    gsm8k: {repo: "openai/gsm8k", prefix: "main/test-", n: 250, max_tokens: 512}
    humaneval: {repo: "openai/openai_humaneval", prefix: "openai_humaneval/test-", n: null, max_tokens: 768}

loadtest:                  # src/loadtest.py: concurrent users within a latency SLA
  levels: [1, 2, 4, 8, 16] # concurrent users (closed loop); the sweep stops after the first level that misses the server SLA
  slots: 16                # llama-server -np (>= max level, so no request waits for a slot)
  ctx_per_slot: 1024       # GSM8K prompt (< 400 tokens) + max_tokens; 16 slots of 7B Q6_K KV (0.9 GiB) still fit 8 GB with the weights
  max_tokens: 256          # natural output length up to this
  requests_per_user: 4     # requests per level = max(min_requests, level x requests_per_user)
  min_requests: 16
  warmup_requests: 2
  sla_percentile: 95       # MLPerf states p99; with 16-64 requests per level p99 is close to the maximum
  sla:                     # MLPerf Inference v5.0 Llama-2-70B limits (MLCommons, 2025-04-02)
    server: {ttft_s: 2.0, tpot_s: 0.200}
    interactive: {ttft_s: 0.450, tpot_s: 0.040}
  targets:                 # (model, quant) measured by `src/loadtest.py` without arguments
    - [Qwen2.5-1.5B-Instruct, Q4_K_M]
    - [Qwen2.5-3B-Instruct, Q4_K_M]
    - [Qwen2.5-7B-Instruct, Q4_K_M]
    - [Qwen2.5-7B-Instruct, Q6_K]
    - [Qwen2.5-14B-Instruct, Q4_K_M]

analysis:
  cv_warn_threshold: 0.03

paths:
  raw_csv: "data/raw/benchmark_raw.csv"          # v0.1 legacy (read-only)
  raw_dir: "data/raw"                            # new runs: <raw_dir>/<hw_id>/benchmark_raw.csv
  quality_dir: "data/quality"                    # <quality_dir>/<hw_id>/...
  quality_rerun_dir: "data/quality_rerun"        # identical re-runs (noise floor for src/consistency.py)
  quality_np1_dirs: ["data/quality_np1", "data/quality_np1_rerun"]  # one-slot run + re-run (--parallel 1): batching vs noise
  isolation_dir: "data/isolation"                # np<slots>_r<k>/<hw_id>/...: cause isolation (src/isolation.py)
  capacity_dir: "data/capacity"                  # <capacity_dir>/<hw_id>/<model>_<quant>.csv (src/loadtest.py)
  processed_stats: "data/processed/benchmark_stats.csv"
  summary_table: "results/tables/summary.csv"
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  summary_json: "results/summary.json"
  logs_dir: "logs"
